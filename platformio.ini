[platformio]
default_envs = esp32-c5

[env:esp32-c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = espidf

board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions16.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults.esp32c5"
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
